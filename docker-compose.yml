name: mecharm-exp2

services:
  moveit:
    image: mecharm-exp2-ros2:humble
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["sleep", "infinity"]
    environment:
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_LOCALHOST_ONLY: "1"
    network_mode: host
    volumes:
      - type: bind
        source: .
        target: /workspace/mecharm_exp2
      - mecharm_build:/opt/mecharm_ws/build
      - mecharm_install:/opt/mecharm_ws/install
      - mecharm_log:/opt/mecharm_ws/log
    working_dir: /workspace/mecharm_exp2
    init: true
    restart: unless-stopped

volumes:
  mecharm_build:
  mecharm_install:
  mecharm_log:
